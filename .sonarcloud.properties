# SonarCloud configuration.
#
# This file used to point at the upstream author's SonarCloud organisation
# (`willianmarquess`), which no longer applies now that this repository is
# standalone. Leaving those values in place would make every analysis run report
# into a project this repository has no access to, and would keep the fork
# coupling in place.
#
# To re-enable SonarCloud, register this repository at
# https://sonarcloud.io (sign in with GitHub, import `wojtkob/open-mt2`), then
# uncomment the two identity lines below and replace the project key with the
# one SonarCloud assigns you. The analysis settings below are unchanged.

# sonar.projectKey=wojtkob_open-mt2
# sonar.organization=wojtkob

sonar.sources=src
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**

sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S6550
sonar.issue.ignore.multicriteria.e1.resourceKey=**/enum/**/*.ts
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S7767
sonar.issue.ignore.multicriteria.e2.resourceKey=**/enum/**/*.ts
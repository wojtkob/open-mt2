name: Release

# Automated build + publish pipeline.
#
# The release is always produced from a commit that already passed the CI gate
# (`flow.yml`, "CI Pipeline"):
#
# * `workflow_run` on a successful master run of the CI Pipeline — the normal
#   path. Every green build is published automatically, with no human step.
# * push of a `v*` tag — a tagged commit is not guaranteed to have passed CI, so
#   this path runs the gate itself before publishing.
# * nightly `schedule` — re-publishes the autobuild from master even when nothing
#   was pushed, which also exercises the ARM64 runner on a fixed schedule.
# * `workflow_dispatch` — manual rerun, optionally overriding the version.
#
# Every path runs:
#
# * native `linux/arm64` runner (ubuntu-24.04-arm): the build, the unit tests and
#   package verification executed on real aarch64 hardware, plus a
#   relocatability smoke test of the produced tarball. This is the primary
#   release source and it gates publication — a release is never published from
#   an artefact set the ARM64 job did not verify;
# * docker buildx + QEMU: a multi-arch image (amd64 / arm64 / arm-v7) pushed to
#   GHCR, with the arm64 variant booted under QEMU to prove it starts.
#
# Published artefacts:
# * `autobuild` — a rolling prerelease rewritten on every successful master
#   build. This is what a Pine A64 user installs.
# * `v*` — an immutable semver release, never rewritten.
on:
  push:
    tags:
      - 'v*'
  workflow_run:
    workflows:
      - CI Pipeline
    branches:
      - master
    types:
      - completed
  schedule:
    # 03:17 UTC daily. Deliberately off the hour: the top of the hour is when
    # every other scheduled workflow on GitHub queues up.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to package (defaults to package.json)'
        required: false
        type: string

concurrency:
  group: release-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_VERSION: '22'
  # The commit to build. On `workflow_run` this is the head of the CI run; for
  # tags, schedules and manual runs it is the triggering commit.
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  # --------------------------------------------------------------------- gate
  gate:
    name: Verify the commit is releasable
    runs-on: ubuntu-latest
    outputs:
      # Every key the `classify` step writes must be declared here, otherwise
      # `needs.gate.outputs.<key>` resolves to an empty string downstream and the
      # artefacts get built with a literal "undefined" version.
      version: ${{ steps.classify.outputs.version }}
      short_sha: ${{ steps.classify.outputs.short_sha }}
      prerelease_version: ${{ steps.classify.outputs.prerelease_version }}
      prerelease: ${{ steps.classify.outputs.prerelease }}
      release_tag: ${{ steps.classify.outputs.release_tag }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - name: Checkout the built commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      # `workflow_run` fires on completion regardless of outcome. A red CI run
      # must never become a published release, so it is dropped here before any
      # runner does real work.
      - name: Reject a failed CI run
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success'
        run: |
          echo "::error::CI Pipeline run ${{ github.event.workflow_run.id }} concluded \
          '${{ github.event.workflow_run.conclusion }}'; nothing will be published."
          exit 1

      - name: Reject a CI run from a fork
        if: github.event_name == 'workflow_run' && github.event.workflow_run.head_repository.full_name != github.repository
        run: |
          echo "::error::Refusing to publish artefacts built from \
          ${{ github.event.workflow_run.head_repository.full_name }}."
          exit 1

      - name: Classify the run
        id: classify
        run: |
          set -eu
          sha="${{ env.RELEASE_SHA }}"
          short="${sha:0:7}"
          version="$(node -p "require('./package.json').version")"

          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          fi

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # An immutable semver release. The tag itself names the version, and
            # a mismatch means the tag was cut without bumping package.json.
            if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version."
              exit 1
            fi
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "release_tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "reason=tagged release $GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            # The rolling autobuild. Rewritten on every green master build.
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "release_tag=autobuild" >> "$GITHUB_OUTPUT"
            echo "reason=autobuild of $version from $short ($GITHUB_REF_NAME)" >> "$GITHUB_OUTPUT"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short" >> "$GITHUB_OUTPUT"
          echo "prerelease_version=${version}-autobuild.$short" >> "$GITHUB_OUTPUT"

      - name: Log the plan
        run: |
          {
            echo "### Release plan"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| commit | \`${{ env.RELEASE_SHA }}\` |"
            echo "| tag | \`${{ steps.classify.outputs.release_tag }}\` |"
            echo "| prerelease | \`${{ steps.classify.outputs.prerelease }}\` |"
            echo "| reason | ${{ steps.classify.outputs.reason }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Tags, schedules and manual runs are not covered by `flow.yml`, so the
      # gate has to run here or an untested commit could be published.
      - name: Setup Node.js
        if: github.event_name != 'workflow_run'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        if: github.event_name != 'workflow_run'
        run: npm ci --ignore-scripts

      - name: Check Prettier formatting
        if: github.event_name != 'workflow_run'
        run: npm run format:check

      - name: Run Lint
        if: github.event_name != 'workflow_run'
        run: npm run lint

      - name: Run unit tests
        if: github.event_name != 'workflow_run'
        run: npm run test:unit

  # -------------------------------------------------------------- build/package
  build:
    name: Build and package (amd64)
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the built commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Package release artefacts
        run: node tools/package/buildRelease.js --arch amd64 --version "${{ needs.gate.outputs.version }}"

      - name: Verify release artefacts
        run: node tools/package/verifyRelease.js --arch amd64 --version "${{ needs.gate.outputs.version }}"

      - name: Upload release artefacts
        uses: actions/upload-artifact@v4
        with:
          name: open-mt2-amd64
          path: |
            build/release/*.tar.gz
            build/release/*.deb
            build/release/SHA256SUMS
          if-no-files-found: error

  # ------------------------------------------------------- native ARM64 build
  arm64:
    name: Build, test and package (native ARM64)
    needs: gate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - name: Report runner architecture
        run: |
          echo "machine: $(uname -m)"
          echo "node   : $(node --version 2>/dev/null || echo 'not installed yet')"
          test "$(uname -m)" = "aarch64"

      - name: Checkout the built commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Run unit tests on ARM64
        run: npm run test:unit

      - name: Package release artefacts
        run: node tools/package/buildRelease.js --arch arm64 --version "${{ needs.gate.outputs.version }}"

      - name: Verify release artefacts
        run: node tools/package/verifyRelease.js --arch arm64 --version "${{ needs.gate.outputs.version }}"

      - name: Smoke test the packaged tree from an unrelated working directory
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -eu
          work_dir="$(mktemp -d)"
          tar -xzf "build/release/open-mt2-${VERSION}-linux-arm64.tar.gz" -C "$work_dir"
          # Rename the prefix and run from an unrelated cwd: ResourcePaths must
          # follow __dirname, never process.cwd(), or every install outside the
          # repository would break.
          mv "$work_dir/open-mt2-${VERSION}" "$work_dir/relocated-server"
          cd "$work_dir"
          node -e "
            const paths = require('$work_dir/relocated-server/dist/core/infra/config/ResourcePaths.js').default;
            const fs = require('node:fs');
            for (const tree of ['attr', 'spawn', 'databaseScripts', 'quests']) {
              const dir = paths.requireResourceDir(tree);
              if (!fs.statSync(dir).isDirectory()) throw new Error('not a directory: ' + dir);
              console.log(tree.padEnd(16), dir);
            }
            if (!fs.existsSync(paths.requireResourceFile('databaseScripts', 'script.sql'))) {
              throw new Error('script.sql missing');
            }
            console.log('projectRoot   ', paths.projectRoot());
          "

      - name: Upload release artefacts
        uses: actions/upload-artifact@v4
        with:
          name: open-mt2-arm64
          path: |
            build/release/*.tar.gz
            build/release/*.deb
            build/release/SHA256SUMS
          if-no-files-found: error

  # ------------------------------------------------------------ container image
  docker:
    name: Multi-arch container image
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout the built commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,arm/v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=autobuild
            type=raw,value=${{ needs.gate.outputs.version }}
            type=raw,value=${{ needs.gate.outputs.prerelease_version }}
            type=sha,format=short

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the arm64 image for a QEMU smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: open-mt2:arm64-smoke
          cache-from: type=gha,scope=arm64-smoke

      - name: Smoke test the arm64 image under QEMU
        run: |
          set -eu
          image=open-mt2:arm64-smoke

          echo "--- runtime"
          docker run --rm --platform linux/arm64 "$image" \
            node -e "console.log('arch', process.arch, '| node', process.version)"

          # Booting the servers without a database exits on the connection
          # attempt, which is fine: what must never happen is a module
          # resolution error, because that would mean the image depends on
          # ts-node/tsconfig-paths or on a devDependency that was pruned.
          for entry in dist/auth/main.js dist/game/main.js dist/tools/database/migrate.js; do
            echo "--- $entry"
            set +e
            output="$(docker run --rm --platform linux/arm64 \
              -e AUTH_SERVER_PORT=11002 -e GAME_SERVER_PORT=13001 \
              -e DB_HOST=127.0.0.1 -e DB_PORT=3306 -e DB_USER=root \
              -e DB_ROOT_PASSWORD=root -e AUTH_DB_DATABASE_NAME=auth \
              -e GAME_DB_DATABASE_NAME=game -e CACHE_HOST=127.0.0.1 \
              -e CACHE_PORT=6379 "$image" node "$entry" 2>&1)"
            set -e
            echo "$output" | tail -n 4
            if echo "$output" | grep -qE "Cannot find module|ERR_MODULE_NOT_FOUND"; then
              echo "::error::$entry could not resolve its modules on arm64"
              exit 1
            fi
          done

          # ResourcePaths must resolve the data trees inside the image too.
          docker run --rm --platform linux/arm64 "$image" node -e "
            const paths = require('/opt/open-mt2/dist/core/infra/config/ResourcePaths.js').default;
            console.log(paths.requireAttr());
            console.log(paths.requireSpawn());
            console.log(paths.requireDatabaseScripts());
            console.log(paths.requireQuests());
          "

      - name: Summary
        run: |
          {
            echo "### Container image"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------- gitHub release
  release:
    name: Publish GitHub release
    needs: [build, arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout the built commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Download amd64 artefacts
        uses: actions/download-artifact@v4
        with:
          name: open-mt2-amd64
          path: build/amd64

      - name: Download ARM64 artefacts
        uses: actions/download-artifact@v4
        with:
          name: open-mt2-arm64
          path: build/arm64

      - name: Combine artefacts and checksums
        run: |
          set -eu
          mkdir -p build/release

          # Each job writes its own SHA256SUMS listing only its own artefacts.
          # Unpacking both into one directory would let the second file silently
          # overwrite the first, so download into separate directories and merge
          # the manifests explicitly here.
          cat build/amd64/SHA256SUMS > build/release/SHA256SUMS
          cat build/arm64/SHA256SUMS >> build/release/SHA256SUMS
          sort -u -k 2 -o build/release/SHA256SUMS build/release/SHA256SUMS

          mv build/amd64/*.tar.gz build/amd64/*.deb build/release/
          mv build/arm64/*.tar.gz build/arm64/*.deb build/release/

          cd build/release
          sha256sum --check --strict SHA256SUMS
          ls -l

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.gate.outputs.release_tag }}
          # Point the rolling tag at the exact commit that was built, so the
          # autobuild tag never drifts ahead of its own artefacts.
          target_commitish: ${{ env.RELEASE_SHA }}
          name: Open MT2 ${{ needs.gate.outputs.version }} (${{ needs.gate.outputs.release_tag }})
          prerelease: ${{ needs.gate.outputs.prerelease }}
          # Only a semver tag becomes "latest"; the rolling prerelease must not
          # take that slot away from a real release.
          make_latest: ${{ needs.gate.outputs.prerelease == 'false' }}
          body: |
            Open MT2 `${{ needs.gate.outputs.release_tag }}` — ${{ needs.gate.outputs.reason }}.

            Commit `${{ env.RELEASE_SHA }}`, built and verified on a native
            `aarch64` runner.

            ## Installing on a Pine A64 (or any ARM64 board)

            ```sh
            # from the ARM64 package
            wget https://github.com/${{ github.repository }}/releases/download/${{ needs.gate.outputs.release_tag }}/open-mt2-${{ needs.gate.outputs.version }}-linux-arm64.tar.gz
            tar -xzf open-mt2-${{ needs.gate.outputs.version }}-linux-arm64.tar.gz
            cd open-mt2-${{ needs.gate.outputs.version }}
            sudo ./scripts/install.sh
            ```

            Or with Docker:

            ```sh
            docker run -d --name open-mt2 --platform linux/arm64 \
              -p 11002:11002 -p 13001:13001 \
              -e DB_HOST=... -e DB_ROOT_PASSWORD=... \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.gate.outputs.release_tag }}
            ```

            The server is architecture independent (pure JavaScript), so the same
            code runs on `amd64`, `arm64` (Pine A64, Raspberry Pi 4/5, Ampere,
            Graviton) and `armv7l`.

            Container image
            `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.gate.outputs.release_tag }}`
            — `linux/amd64`, `linux/arm64`, `linux/arm/v7`.

            Install guide: [`docs/arm64.md`](https://github.com/${{ github.repository }}/blob/${{ needs.gate.outputs.release_tag }}/docs/arm64.md).
          files: |
            build/release/*.tar.gz
            build/release/*.deb
            build/release/SHA256SUMS
          fail_on_unmatched_files: true

      # The rolling autobuild tag is rewritten on every green build, so its
      # assets accumulate: each run would otherwise leave the previous build's
      # tarball and .deb sitting next to the new ones. Pruning runs *after*
      # publishing so a failed upload never leaves the release empty, and only
      # assets absent from this run's directory are removed.
      - name: Prune superseded assets from the rolling autobuild release
        if: needs.gate.outputs.prerelease == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.gate.outputs.release_tag }}
        run: |
          set -eu
          release_id="$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" \
            --jq '.id' 2>/dev/null || true)"

          if [ -z "$release_id" ]; then
            echo "No existing $TAG release; nothing to prune."
            exit 0
          fi

          # The filenames this run published, e.g. "open-mt2-1.0.0-linux-arm64.tar.gz".
          published="$(cd build/release && ls -1)"

          echo "Pruning assets from release $release_id ($TAG) not in this build:"
          gh api "repos/${{ github.repository }}/releases/$release_id/assets" \
            --paginate --jq '.[] | "\(.id)\t\(.name)"' |
            while IFS=$'\t' read -r id name; do
              [ -n "$id" ] || continue
              if printf '%s\n' "$published" | grep -Fxq "$name"; then
                echo "  keeping   $name"
              else
                echo "  deleting  $name"
                gh api --method DELETE "repos/${{ github.repository }}/releases/assets/$id"
              fi
            done

      - name: Release summary
        env:
          TAG: ${{ needs.gate.outputs.release_tag }}
          IS_PRERELEASE: ${{ needs.gate.outputs.prerelease }}
          SHA: ${{ env.RELEASE_SHA }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          {
            echo "### Release published"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| tag | [\`$TAG\`](${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG) |"
            echo "| version | \`$VERSION\` |"
            echo "| prerelease | \`$IS_PRERELEASE\` |"
            echo "| commit | \`$SHA\` |"
            echo "| image | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$TAG\` |"
          } >> "$GITHUB_STEP_SUMMARY"